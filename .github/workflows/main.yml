name: BabyOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: babyops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Expo Application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript (informational)
        continue-on-error: true
        run: npx tsc --noEmit --ignoreDeprecations 6.0

      - name: Check Expo configuration
        run: npx expo config --type public
